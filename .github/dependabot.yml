# Actualizaciones semanales de dependencias. Cada propuesta pasa por el CI completo y entra por develop,
# como cualquier otro cambio. Se esperan 7 días desde cada publicación: una versión recién salida y
# comprometida suele retirarse antes.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    cooldown: { default-days: 7 }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    cooldown: { default-days: 7 }
