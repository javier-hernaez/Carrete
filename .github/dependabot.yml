# Actualizaciones semanales de dependencias. Cada propuesta pasa por el CI completo.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
